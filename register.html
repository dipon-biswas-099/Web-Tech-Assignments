<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New employee</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>


</head>
<body>
    <header>
        <div class = "navber">
            <div class="home">
                <a href="index.html">Home</a>

            </div>
            <div class="register">
                <a href="register.html">Register For New Employee</a>

            </div>
            <div class="list">
                <a href="empList.html">View Employee List</a>

            </div>

        </div>
    </header>
    <h1 id="title">Register New Employee</h1>
    <br>
    <div class="reg">
    <table>
        <form action="" method="post" onsubmit="return validateForm()" >
            <tr>
                <td><label for="empID">Employee ID</label></td>
                <td><input type="text" id = "empID"></td>
                <td><span id="idError"></span></td>
            </tr>
            <tr>
                <td><label for="name">Full Name</label></td>
                <td><input type="text" id = "name"></td>
                <td><span id="nameError"></span></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="text" id = "email"></td>
                <td><span id="emailError"></span></td>
            </tr>
            <tr>
                <td><label for="department">Department</label></td>
                <td>
                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                        <option value="IT">IT</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                </td>
                <td><span id="departmentError"></span></td>
            </tr>
            <tr>
                <td><label for="joiningDate">Joining Date</label></td>
                <td><input type="date" id="joiningDate"></td>
                <td><span id="joiningDateError"></span></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" id="male" value="Male"><label for="male">Male</label>
                    <input type="radio" name="gender" id="female" value="Female"><label for="female">Female</label>
                    <input type="radio" name="gender" id="other" value="Other"><label for="other">Other</label>
                </td>
                <td><span id="genderError"></span></td>
            </tr>
            <tr>
                <td><label for="employmentType">Employment Type</label></td>
                <td><input type="checkbox" id="employmentType" value="Full-Time"><label for="employmentType">Full-Time</label></td>
                <td><span id="employmentTypeError"></span></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center">
                  <button type="submit" id="button1">submit</button>
                </td>
              </tr>

        </form>
    </table>
</div>
    
</body>
</html>
